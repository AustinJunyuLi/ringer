# Model identity registry — resolves (engine, manifest model field) into the
# display taxonomy: Model / Lab / Harness / Access. This is what the scoreboard and
# Ringside show, and what keeps engine names (codex) from masquerading as
# model names.
#
# confidence: "verified" requires a cited source (see source field);
# "unverified" entries are best current knowledge awaiting the capability
# research pass. Update via PR — this file is loaded into the local read DB.

[engines.codex]
harness = "Codex CLI"
access = "OAuth plan"
default_model_key = "gpt-5.5"

[engines.codex.models."gpt-5.5"]
display = "GPT-5.5"
lab = "OpenAI"
confidence = "verified"     # snapshot gpt-5.5-2026-04-23, Codex CLI default; see capability file
source = "https://developers.openai.com/codex/models"
last_verified = 2026-07-10

[engines.codex.models."gpt-5.6-sol"]
display = "GPT-5.6 Sol"
lab = "OpenAI"
confidence = "verified"
source = "https://developers.openai.com/codex/models"
last_verified = 2026-07-10

[engines.codex.models."gpt-5.6-luna"]
display = "GPT-5.6 Luna"
lab = "OpenAI"
confidence = "verified"
source = "https://developers.openai.com/codex/models"
last_verified = 2026-07-10

[engines.codex.models."gpt-5.6-terra"]
display = "GPT-5.6 Terra"
lab = "OpenAI"
confidence = "verified"
source = "https://developers.openai.com/codex/models"
last_verified = 2026-07-10

[engines.grok]
harness = "Grok Build CLI"
access = "OAuth plan"
default_model_key = "grok-build"

[engines.grok.models."grok-build"]
# "Grok Build" is the HARNESS (the CLI product), never a model name. The CLI
# serves exactly two models: Grok 4.5 (xAI) and Composer 2.5 (Cursor). The
# 'grok-build' engine default resolves to Grok 4.5. An earlier entry here
# wrongly recorded "Grok Build 0.1" as a model — do not reintroduce it.
display = "Grok 4.5"
lab = "xAI"
confidence = "verified"     # operator-confirmed (Jon, 2026-07-10): Grok Build CLI serves Grok 4.5 + Composer 2.5
source = "https://docs.x.ai/developers/release-notes"
last_verified = 2026-07-10
noncanonical_slugs = ["opencode:openrouter/x-ai/grok-4.5"]

[engines.grok.models."grok-composer-2.5-fast"]
display = "Composer 2.5 Fast"
lab = "Cursor (Anysphere)"
confidence = "verified"     # Cursor (Anysphere) model, served through xAI's Grok Build CLI in our setup
source = "https://cursor.com/blog/composer-2-5"
last_verified = 2026-07-10

[engines.opencode]
harness = "OpenCode"
access = "OpenRouter API"
# model key = the manifest "model" slug; entries below map slugs to display
# names. Unlisted slugs are marked unregistered and derive a display name;
# their complete raw value appears only in scoreboard diagnostics until verified.

[engines.opencode.models."openrouter/z-ai/glm-5.2"]
display = "GLM 5.2"
lab = "Z.ai (Zhipu AI)"
confidence = "verified"
source = "manifest model field; OpenRouter slug z-ai/glm-5.2"
last_verified = 2026-07-10

[engines.opencode.models."openrouter/moonshotai/kimi-k2.7-code"]
display = "Kimi K2.7 Code"
lab = "Moonshot AI"
confidence = "verified"
source = "manifest model field; OpenRouter slug moonshotai/kimi-k2.7-code"
last_verified = 2026-07-10

[engines.opencode.models."openrouter/nvidia/nemotron-3-super-120b-a12b:free"]
display = "Nemotron 3 Super 120B (free)"
lab = "NVIDIA"
confidence = "verified"
source = "manifest model field; OpenRouter slug nvidia/nemotron-3-super-120b-a12b:free"
last_verified = 2026-07-10

[engines.opencode.models."openrouter/meta-llama/llama-3.3-70b-instruct:free"]
display = "Llama 3.3 70B Instruct (free)"
lab = "Meta"
confidence = "verified"
source = "manifest model field; OpenRouter slug meta-llama/llama-3.3-70b-instruct:free"
last_verified = 2026-07-10

# ---------------------------------------------------------------------------
# Local lanes (2026-07-28). Upstream ships codex/grok/opencode; this install
# also runs the Claude Code and Kimi Code CLIs, so their identities are
# declared here. Canonical keys are the short CLI nicknames; the long forms
# are recorded as noncanonical so the scoreboard stops splitting one model
# across two rows and lint catches the duplicate spelling at authoring time.
# ---------------------------------------------------------------------------

[engines.claude]
harness = "Claude Code CLI"
access = "OAuth plan"
default_model_key = "sonnet"

[engines.claude.models."sonnet"]
display = "Claude Sonnet"
lab = "Anthropic"
confidence = "unverified"     # the alias floats over snapshots; a release lands in this row invisibly
source = "claude --help v2.1.216 (local)"
last_verified = 2026-07-28
noncanonical_slugs = ["claude:claude-sonnet-5"]

[engines.claude.models."opus"]
display = "Claude Opus"
lab = "Anthropic"
confidence = "unverified"     # alias floats; verified headless 2026-07-21
source = "claude --help v2.1.216 (local)"
last_verified = 2026-07-28
noncanonical_slugs = ["claude:claude-opus-5"]

[engines.claude.models."fable"]
display = "Claude Fable 5"
lab = "Anthropic"
confidence = "unverified"     # red-phone lane, user-invoked only
source = "claude --help v2.1.216 (local)"
last_verified = 2026-07-28
noncanonical_slugs = ["claude:claude-fable-5"]

[engines.kimi]
harness = "Kimi Code CLI"
access = "OAuth plan"
default_model_key = "kimi-code/k3"

# The three k3-* aliases are one trained artifact at three reasoning efforts
# (see ~/.kimi-code/config.toml: each sets default_effort). They stay separate
# rows on purpose — upstream's effort attribution reads Codex's -c flag only,
# so for this lane the model field is the only place effort is observable.
