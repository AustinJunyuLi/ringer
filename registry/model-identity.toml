# Alias of k3 pinned to max thinking effort (added 2026-07-21). Same trained
# artifact as kimi-code/k3 — display kept distinct ("Kimi K3 Max") so
# scoreboard rows for the two effort cells don't merge; the kimi harness has
# no effort flag, so the alias is the effort carrier.
[engines.kimi.models."kimi-code/k3max"]
display = "Kimi K3 Max"
lab = "Moonshot AI"
confidence = "verified"
source = "https://www.kimi.com/code"
last_verified = 2026-07-21

# Per-effort k3 aliases (added 2026-07-27). Kimi Code's models table keys ARE
# the -m aliases and default_effort is per-alias, so these three point at the
# same underlying "k3" with different effort — giving the native CLI lane
# per-dispatch adaptive effort despite having no --effort flag. Displays kept
# distinct so the scoreboard does not merge the three effort cells, same
# convention as k3max above. Defined in ~/.kimi-code/config.toml.
[engines.kimi.models."k3-low"]
display = "Kimi K3 · low"
lab = "Moonshot AI"
confidence = "verified"       # live dispatch 2026-07-27
source = "~/.kimi-code/config.toml alias -> model k3, default_effort=low"
last_verified = 2026-07-27

[engines.kimi.models."k3-high"]
display = "Kimi K3 · high"
lab = "Moonshot AI"
confidence = "verified"
source = "~/.kimi-code/config.toml alias -> model k3, default_effort=high"
last_verified = 2026-07-27

[engines.kimi.models."k3-max"]
display = "Kimi K3 · max"
lab = "Moonshot AI"
confidence = "verified"       # live dispatch 2026-07-27
